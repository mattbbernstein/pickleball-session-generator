[project]
name = "pickleball-session-generator"
version = "0.1.0"
description = "Generate and score randomized pickleball doubles session schedules."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
pickleball-session-generator = "best_session:main"

[dependency-groups]
build = ["pyinstaller>=6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["pickleball_round", "pickleball_session", "best_session"]

[tool.setuptools.package-dir]
"" = "src"
